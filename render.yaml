services:
  - type: web
    name: sabor-de-casa
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/saude
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_USUARIO
        value: admin
      - key: ADMIN_SENHA
        sync: false
      - key: JWT_SEGREDO
        generateValue: true
