<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pratos | Sabor de Casa</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>

<body>
  <header class="cabecalho">
    <div class="cabecalho-conteudo">
      <a class="marca" href="gerenciamento.html">
        <span class="icone-marca" aria-hidden="true">🍽️</span>
        <span class="marca-texto">
          <strong>Sabor de Casa</strong>
          <span>Gerenciamento do cardápio</span>
        </span>
      </a>
      <nav class="menu">
        <a href="index.html">Ver cardápio</a>
        <a href="gerenciamento.html">Categorias</a>
        <button class="link-menu" type="button" data-sair>Sair</button>
      </nav>
    </div>
  </header>

  <main class="conteudo">
    <a class="voltar" href="gerenciamento.html">← Voltar para categorias</a>

    <section class="topo-pagina">
      <div>
        <h1 id="titulo-categoria">Pratos</h1>
        <p class="subtitulo">Pratos cadastrados nesta categoria.</p>
      </div>
      <a id="link-novo-prato" class="botao botao-principal" href="#">Novo prato</a>
    </section>

    <div id="mensagem" class="mensagem" role="alert"></div>

    <section class="painel">
      <div class="barra-filtros">
        <input id="pesquisa" class="campo-pesquisa" type="search" placeholder="Pesquisar prato"
          aria-label="Pesquisar prato">
        <select id="filtro-disponibilidade" aria-label="Filtrar por disponibilidade">
          <option value="todos">Todos</option>
          <option value="disponiveis">Disponíveis</option>
          <option value="indisponiveis">Indisponíveis</option>
        </select>
      </div>
      <div id="lista-pratos" class="lista-cartoes">
        <p class="estado-lista">Carregando pratos...</p>
      </div>
    </section>
  </main>

  <script src="js/config.js"></script>
  <script src="js/autenticacao.js"></script>
  <script src="js/api.js"></script>
  <script src="js/comum.js"></script>
  <script src="js/pratos.js"></script>
</body>

</html>
